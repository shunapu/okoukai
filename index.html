<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skybound Runner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-shell">
        <header class="game-header">
            <div>
                <p class="eyebrow">RETRO ARCADE // STAGE 01</p>
                <h1>Skybound Runner</h1>
            </div>
            <div class="hud" aria-live="polite">
                <span>コイン <strong id="coin-count">0</strong></span>
                <span>ライフ <strong id="life-count">♥♥♥</strong></span>
            </div>
        </header>

        <section class="game-card">
            <div class="canvas-wrap">
                <canvas id="game" width="960" height="540" aria-label="横スクロールアクションゲーム"></canvas>
                <div id="message" class="message hidden">
                    <p id="message-title">ステージクリア！</p>
                    <button id="restart-button" type="button">もう一度遊ぶ</button>
                </div>
            </div>
            <div class="controls">
                <span><kbd>←</kbd><kbd>→</kbd> 移動</span>
                <span><kbd>Space</kbd> ジャンプ</span>
                <span><kbd>R</kbd> リスタート</span>
            </div>
        </section>
        <p class="hint">コインを集めながら、右端の旗を目指そう。敵に3回ぶつかるとゲームオーバー！</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
